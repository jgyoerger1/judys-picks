    <rect x="1550.5" y="122.5" width="535" height="467" rx="98" stroke-width="20" filter="url(#tight)"/>
    <rect x="1550.5" y="122.5" width="535" height="467" rx="98" stroke-width="16" opacity="0.95"/>
  </g>
