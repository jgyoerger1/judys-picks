  <title>SHIFT ai</title>
  <!-- SHIFTai lockup, for light backgrounds. Identical geometry to the dark
       variant: same traced paths, same neon. Two differences, both deliberate.
       The type is filled #141416 rather than white — drawn in dark ink from the
       same paths, not a recolour of a raster, which is why it has no halo. And
       the tube core is #FDF4FF rather than pure white, because a white core on a
       white page reads as a gap in the tube instead of a lit one. -->
